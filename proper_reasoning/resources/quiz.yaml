presentation: "Buongiorno a tutti. Mi chiamo Navel, sono un piccolo robot con il cappello. Sono venuto nella vostra scuola per testare la vostra intelligenza. Il vostro scopo è risolvere tutti gli enigmi che vi farò per uscire da questa stanza. Ogni tanto mi potrete chiedere aiuto, per chiedermi un indizio dovrete chiamarmi per nome. Inizamo"
present_quiz1: "Per superare il primo indovinello dovrete indovinare l'animale che ho in mente. "
guess_quiz1: "Avete indovinato il primo indovinello, guardate sotto il tavolo per trovare il secondo indizio"
present_quiz2_1: "Il prossimo enigma consiste nel trovare la cifra che sblocca il lucchetto. Due cifre sono fatti dai primi due numeri corrispondenti all'anno di "
present_quiz2_2: "Successivamente dovrete guardare il calendario. Ditemi quando siete riusciti a sbloccare il lucchetto mostrando la apposita carta."
guess_quiz2: "Siete riusciti a sbloccare il lucchetto"
present_quiz3: "Il terzo e ultimo enigma consiste nel mostrarmi la sequenza di colori corretta. Avete un ultimo tentativo."
guess_quiz3: "Siete stati molto astuti, ora avete il permesso di uscire."
