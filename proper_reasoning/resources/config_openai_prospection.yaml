    Conscientiousness: Industriousness, Precision, Scrupulousness, Orderliness
    Low Conscientiousness: Unreliability, Distraction, Laziness, Disorder, Thoughtlessness

    When the agent has to achieve a goal and predict to execute a necessary action that not satisfy its personality dependent hedonic experience Comfortability decreases linearly over time in direct proportion to the magnitude of your current personality coefficients. 
    Comfortability varies directly with perception: whenever you receive a new perception, you must instantly update comfortability and simulate the next set of actions accordingly. 
    Conscientious agent: comfortability decrease when perceived anger
    Distracted agent: comfortability not vary according to perception
    Extrovert agent: comfortability increase for High-arousal emotions (Anger, Happyness, Fear). Comfortability decrease for low-arousal emotions (Neutrality).
    Introvert agent: Comfortability increase for low-arousal emotions (Neutrality). Comfortability decrease for High-arousal emotions (Anger, Happyness, Fear). 
    Agreeable agent: Comfortability increase positive valence emotions (Happyness). Comfortability decrease negative valence (sadness,  Anger,  Disgust, Fear).
